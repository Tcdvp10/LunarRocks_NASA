<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#061735">
    <link rel="icon" type="image/png" href="media/Space Apps Logo Color and White motif.png">
    <title>Welcome to the Moon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 25px;
            background:
                linear-gradient(rgba(2, 8, 23, .55), rgba(2, 8, 23, .85)),
                url("https://images-assets.nasa.gov/image/as11-40-5875/as11-40-5875~large.jpg") center / cover fixed;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .arrival {
            max-width: 700px;
            padding: 35px;
            background: rgba(3, 12, 31, .7);
            border: 1px solid rgba(104, 170, 255, .4);
            border-radius: 20px;
            backdrop-filter: blur(12px);
        }

        .arrival h1 {
            color: #68aaff;
            font-size: clamp(2.5rem, 7vw, 5rem);
        }

        .arrival p {
            color: #c8d8f0;
            line-height: 1.7;
        }

        .explore-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            padding: 16px 35px;
            border-radius: 50px;
            border: 1px solid #68aaff;

            background: linear-gradient(110deg, #0b3d91, #2476d8);

            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 0.12em;

            box-shadow: 0 0 25px rgba(104, 170, 255, 0.3);

            transition: all 0.3s ease;
        }

        .explore-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 35px rgba(104, 170, 255, 0.7);
            background: linear-gradient(110deg, #2476d8, #4295ff);
        }

        .explore-button span {
            font-size: 1.3rem;
        }
    </style>
</head>

<body>

    <main class="arrival">

        <p>MISSION COMPLETE · LUNAR BASE</p>

        <h1>Welcome to the Moon.</h1>

        <h2 id="agentWelcome">Welcome, Space Agent!</h2>

        <p>
            Your journey has officially begun.
            Explore the Moon, discover the equipment,
            and complete your lunar mission.
        </p>
        <a href="moon.html" class="explore-button">
            BEGIN EXPLORING
            <span aria-hidden="true">→</span>
        </a>
    </main>

    <script>
        const name = localStorage.getItem("spaceAgentName");

        const welcome = document.getElementById("agentWelcome");

        if (name) {
            welcome.textContent = `Welcome, Space Agent ${name}!`;
        }
    </script>

</body>

</html>

</html>
