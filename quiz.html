<section id="quiz">
    <div class="quiz">
        <div class="kicker">Test what you learned</div>
        <h2>Your turn, space explorer.</h2>
        <p id="question">Which robot was the first to drive across Mars?</p>
        <div class="answers" id="answers">
            <button class="answer" data-answer="Sojourner">Sojourner</button><button class="answer"
                data-answer="Curiosity">Curiosity</button><button class="answer"
                data-answer="Perseverance">Perseverance</button><button class="answer" data-answer="Lunokhod 1">Lunokhod
                1</button>
        </div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <button class="primary quiz-next" id="next" hidden>Next question →</button>
    </div>
</section>
<script>

    document.querySelectorAll(".filter").forEach(b => b.addEventListener("click", () => {
        document.querySelectorAll(".filter").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        activeFilter = b.dataset.filter;
        renderCards();
    }));

    document.getElementById("search").addEventListener("input", renderCards);

    cards.addEventListener("click", e => {
        const c = e.target.closest(".card");
        if (c) openMission(c.dataset.id);
    });

    cards.addEventListener("keydown", e => {
        if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")) {
            e.preventDefault();
            openMission(e.target.dataset.id);
        }
    });

    document.getElementById("close").addEventListener("click", closeModal);

    document.getElementById("modal").addEventListener("click", e => {
        if (e.target.id === "modal") closeModal();
    });

    document.addEventListener("keydown", e => {
        if (e.key === "Escape") closeModal();
    });

    document.getElementById("menu").addEventListener("click", () => {
        document.getElementById("navlinks").classList.toggle("show");
    });

    document.querySelectorAll(".navlinks a").forEach(a => a.addEventListener("click", () => {
        document.getElementById("navlinks").classList.remove("show");
    }));

    renderCards();

    const questions = [
        { q: "Which robot was the first to drive across Mars?", a: ["Sojourner", "Curiosity", "Perseverance", "Lunokhod 1"], correct: "Sojourner", why: "Sojourner explored Mars in 1997 as part of the Pathfinder mission." },
        { q: "What happened to the bottom half of the Apollo 11 Moon lander?", a: ["It returned to Earth", "It stayed on the Moon", "It went to Mars", "It is still flying near Earth"], correct: "It stayed on the Moon", why: "The astronauts took off in the top half. The bottom half stayed at the landing site." },
        { q: "What did the Curiosity rover help scientists learn?", a: ["It found living things", "Mars once had water", "It went to the Moon", "It launched in 1969"], correct: "Mars once had water", why: "Curiosity found signs of an ancient watery place, not life itself." },
        { q: "Which spacecraft flew past the giant planets and kept going?", a: ["Sojourner", "Apollo 15 rover", "Voyager 1", "Pathfinder lander"], correct: "Voyager 1", why: "Voyager 1 flew past Jupiter and Saturn, then continued farther into space." }
    ];

    let qi = 0, answered = false;

    function loadQuestion() {
        const x = questions[qi];
        document.getElementById("question").textContent = x.q;
        document.getElementById("answers").innerHTML = x.a.map(a => `<button class="answer" data-answer="${a}">${a}</button>`).join("");
        document.getElementById("feedback").textContent = "";
        document.getElementById("next").hidden = true;
        answered = false;
    }

    document.getElementById("answers").addEventListener("click", e => {
        const b = e.target.closest(".answer");
        if (!b || answered) return;

        answered = true;
        const x = questions[qi];

        document.querySelectorAll(".answer").forEach(a => {
            if (a.dataset.answer === x.correct) a.classList.add("correct");
            else if (a === b) a.classList.add("wrong");
            a.disabled = true;
        });

        document.getElementById("feedback").textContent = (b.dataset.answer === x.correct ? "Correct! " : "Not quite. ") + x.why;
        document.getElementById("next").hidden = false;
        document.getElementById("next").textContent = qi === questions.length - 1 ? "Try again ↻" : "Next question →";
    });

    document.getElementById("next").addEventListener("click", () => {
        qi = qi === questions.length - 1 ? 0 : qi + 1;
        loadQuestion();
    });

    const guideTips = {
        explore: "A rover is a robot that explores another world.",
        timeline: "A mission timeline shows what happened and when.",
        stories: "The machine's voice is make-believe; its mission facts are real.",
        quiz: "Ready to test what you learned? Take your best guess!",
        sources: "NASA's mission pages are a great place to learn more."
    };
    const guideTip = document.getElementById("guideTip");
    const guideObserver = new IntersectionObserver(entries => {
        const current = entries.find(entry => entry.isIntersecting);
        if (current && guideTips[current.target.id]) guideTip.textContent = guideTips[current.target.id];
    }, { rootMargin: "-30% 0px -55% 0px" });
    Object.keys(guideTips).forEach(id => guideObserver.observe(document.getElementById(id)));

    const ship = document.getElementById("travelingShip");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    if (!reduceMotion.matches) {
        let shipUpdatePending = false;
        const updateShip = () => {
            const pageLength = document.documentElement.scrollHeight - window.innerHeight;
            const progress = pageLength > 0 ? window.scrollY / pageLength : 0;
            const x = (window.innerWidth - 72) * (.5 + .38 * Math.sin(progress * Math.PI * 2));
            const y = window.innerHeight * (.12 + progress * .68);
            ship.style.transform = `translate3d(${x}px,${y}px,0) rotate(${Math.sin(progress * Math.PI * 2) * 12}deg)`;
            shipUpdatePending = false;
        };
        window.addEventListener("scroll", () => {
            if (shipUpdatePending) return;
            shipUpdatePending = true;
            window.requestAnimationFrame(updateShip);
        }, { passive: true });
        window.addEventListener("resize", updateShip);
        updateShip();
    }
</script>
